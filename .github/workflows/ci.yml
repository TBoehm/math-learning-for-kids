name: Tests

# Veröffentlicht wird automatisch von GitHub Pages ("Deploy from a branch: main").
# Dieser Workflow prüft jeden Push und jeden Pull Request.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high
      - name: Aufgaben-Generator, Prüf-Logik, Fortschritt
        run: npm test

  e2e:
    name: Browser-Tests (Ende-zu-Ende)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Chromium installieren
        run: npm exec -- playwright install --with-deps chromium
      - name: Oberfläche im Browser testen (Handy, Tablet, Desktop)
        run: npm run test:e2e
