<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Einhorn-Rechenranch</title>
  <meta name="description" content="Halbschriftlich rechnen üben mit Einhörnern und Pferden – Plus, Minus, Mal und Geteilt bis 100 für die 3. Klasse.">
  <meta name="theme-color" content="#b9e4ff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/vehicles.css">
  <link rel="stylesheet" href="css/column.css">
</head>
<body>
  <!-- Hintergrund-Szene -->
  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <div class="rainbow"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <svg class="hills" viewBox="0 0 1440 260" preserveAspectRatio="none">
      <path d="M0,150 C240,60 420,90 640,150 C860,210 1080,70 1440,120 L1440,260 L0,260 Z" fill="#bfe8a7"/>
      <path d="M0,200 C300,130 520,170 760,200 C1000,230 1220,150 1440,180 L1440,260 L0,260 Z" fill="#9ed98a"/>
    </svg>
    <!-- Werkstatt-Welt: Kran und Straße -->
    <svg class="crane" viewBox="0 0 220 300" aria-hidden="true">
      <g fill="none" stroke="#3d4451" stroke-width="6" stroke-linejoin="round">
        <path d="M60 300 V40 M84 300 V40 M60 40 H84"/>
        <path d="M60 280 L84 255 L60 230 L84 205 L60 180 L84 155 L60 130 L84 105 L60 80 L84 55" stroke-width="4"/>
        <path d="M20 40 H210 M20 40 L72 10 L210 40 M72 10 V40"/>
        <path d="M180 40 V120" stroke-width="3"/>
      </g>
      <rect x="10" y="40" width="34" height="26" rx="4" fill="#3d4451"/>
      <rect x="164" y="120" width="34" height="18" rx="3" fill="#ff8a1f"/>
      <rect x="60" y="28" width="24" height="16" rx="3" fill="#ffd23f"/>
    </svg>
    <div class="road"></div>
    <div class="flowers"></div>
    <div class="twinkles"></div>
  </div>

  <header class="topbar">
    <div class="brand"><span class="brand-icon" id="brandIcon">🦄</span><span class="brand-text" id="brandText">Einhorn-<wbr>Rechenranch</span></div>
    <div class="stats">
      <span class="stat" title="Gesammelte Sterne"><span aria-hidden="true">⭐</span> <b id="starCount">0</b></span>
      <span class="stat" title="Richtig ohne Fehler hintereinander"><span aria-hidden="true">🔥</span> <b id="streakCount">0</b></span>
      <button class="icon-btn theme-btn" id="themeBtn" aria-label="Welt wechseln" title="Welt wechseln">🏎️</button>
      <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">⚙️</button>
    </div>
  </header>

  <main class="layout">
    <nav class="ops" aria-label="Rechenart wählen">
      <div class="op-chips" id="opChips"></div>
      <div class="strat-chips" id="stratChips"></div>
    </nav>

    <section class="stage">
      <aside class="buddy" id="buddy">
        <div class="bubble" id="bubble">
          <span id="bubbleText" aria-live="polite">Hallo!</span>
        </div>
        <button class="buddy-figure" id="buddyFigure" aria-label="Begleiter antippen"></button>
      </aside>

      <article class="card task-card" id="taskCard">
        <div class="task-head">
          <span class="strategy-badge" id="strategyBadge"></span>
          <h1 class="equation" id="equation"></h1>
        </div>
        <div class="rows" id="rows"></div>
        <div class="viz" id="viz"></div>
        <div class="actions">
          <button class="btn btn-ghost" id="hintBtn">💡 Tipp</button>
          <button class="btn btn-primary" id="checkBtn">Prüfen ✔</button>
          <button class="btn btn-ghost" id="newBtn">🔄 Neue Aufgabe</button>
        </div>
      </article>
    </section>

    <div class="numpad" id="numpad" aria-label="Zahlenfeld"></div>
  </main>

  <!-- Begrüßung / Begleiter wählen -->
  <dialog class="sheet" id="welcomeDlg">
    <form method="dialog" class="sheet-inner" id="welcomeForm">
      <h2 id="welcomeTitle">Willkommen auf der Rechenranch! 🌈</h2>
      <label class="name-field">Wie heißt du?
        <input type="text" id="nameInput" maxlength="20" autocomplete="off" placeholder="Dein Name">
      </label>
      <p class="sheet-sub">Wähle deine Welt:</p>
      <div class="world-grid" id="worldGrid"></div>
      <p class="sheet-sub">Wähle deinen Begleiter:</p>
      <div class="buddy-grid" id="buddyGrid"></div>
      <button class="btn btn-primary btn-big" value="ok">Los geht's! 🐎</button>
    </form>
  </dialog>

  <!-- Einstellungen -->
  <dialog class="sheet" id="settingsDlg">
    <form method="dialog" class="sheet-inner">
      <h2>Einstellungen</h2>
      <fieldset class="setting">
        <legend>Zehnerübergang (bei Plus und Minus)</legend>
        <div class="seg" data-setting="crossing">
          <button type="button" data-value="ohne">ohne</button>
          <button type="button" data-value="egal">gemischt</button>
          <button type="button" data-value="mit">mit</button>
        </div>
      </fieldset>
      <fieldset class="setting">
        <legend>Zahlenraum</legend>
        <div class="seg" data-setting="range">
          <button type="button" data-value="100">bis 100</button>
          <button type="button" data-value="1000">bis 1000</button>
        </div>
      </fieldset>
      <fieldset class="setting">
        <legend>Wie viel Hilfe?</legend>
        <div class="seg" data-setting="level">
          <button type="button" data-value="hilfe">Mit Hilfe</button>
          <button type="button" data-value="zerlegen">Zerlegung selbst</button>
          <button type="button" data-value="selbst">Alles selbst</button>
        </div>
        <small class="setting-note" id="levelNote"></small>
      </fieldset>
      <label class="toggle"><input type="checkbox" data-setting="rest">
        <span><b>Geteilt mit Rest</b><small>z. B. 87 : 6 = 14 Rest 3</small></span></label>
      <label class="toggle"><input type="checkbox" data-setting="sound">
        <span><b>Töne</b><small>Klänge und Hufgetrappel</small></span></label>
      <fieldset class="setting">
        <legend>Zahlenfeld zum Tippen</legend>
        <div class="seg" data-setting="numpad">
          <button type="button" data-value="auto">automatisch</button>
          <button type="button" data-value="on">immer</button>
          <button type="button" data-value="off">aus</button>
        </div>
      </fieldset>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" id="changeBuddyBtn">🎨 Welt, Begleiter &amp; Name</button>
        <button type="button" class="btn btn-ghost btn-danger" id="resetBtn">Fortschritt löschen</button>
      </div>
      <button class="btn btn-primary btn-big" value="ok">Fertig</button>
    </form>
  </dialog>

  <!-- Neuer Begleiter freigeschaltet -->
  <dialog class="sheet unlock" id="unlockDlg">
    <form method="dialog" class="sheet-inner">
      <h2>Neu freigeschaltet! 🎉</h2>
      <div class="unlock-figure" id="unlockFigure"></div>
      <p class="sheet-sub" id="unlockText"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary btn-big" id="unlockTake">Mitnehmen! 💖</button>
        <button class="btn btn-ghost" value="later">Später</button>
      </div>
    </form>
  </dialog>

  <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/tasks.js"></script>
  <script src="js/check.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/companion.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/ui-logic.js"></script>
  <script src="js/viz-logic.js"></script>
  <script src="js/viz.js"></script>
  <script src="js/formats/schriftlich.js"></script>
  <script src="js/layouts/column.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
